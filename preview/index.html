<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LUMEN Night — browser preview</title>
  <link rel="stylesheet" href="preview.css?v=4">
  <style>
    :root {
      --rpx: calc(min(100vw, 430px) / 750);
    }

    body {
      margin: 0;
      background: #16141c;
      color: #f4f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .note {
      margin: 0;
      padding: 12px 16px 8px;
      color: #9a94ae;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .device {
      width: min(100vw, 430px);
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #07060b;
    }

    .device * {
      box-sizing: border-box;
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .device .nav,
    .device .dock {
      position: relative;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      flex-shrink: 0;
    }

    .device .nav {
      padding-top: 14px;
    }

    .device .bar {
      min-height: calc(88 * var(--rpx));
    }

    .home .page {
      padding-bottom: calc(28 * var(--rpx));
    }

    .device button {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      background: transparent;
    }

    .device input,
    .device select {
      font-family: inherit;
      font-size: max(16px, calc(30 * var(--rpx)));
    }

    .device input:focus,
    .device select:focus {
      outline: none;
      border-color: rgba(61, 255, 242, 0.85);
    }

    .device select.field {
      appearance: none;
    }

    .wave,
    .choice,
    .agree,
    .code-wrap,
    .row {
      cursor: pointer;
    }

    #dock[hidden] {
      display: none !important;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal[hidden] {
      display: none !important;
    }

    .sheet {
      width: 100%;
      padding: 22px 18px 16px;
      border-radius: 20px;
      background: #14121c;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sheet-copy {
      margin: 8px 0 18px;
      color: #b7b1c9;
      font-size: 14px;
      line-height: 1.45;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-actions button {
      flex: 1;
    }

    .device .danger {
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: #ff2bd6;
      color: #1a0612;
      font-size: 15px;
      font-weight: 700;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 50;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 18, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f0ff;
      font-size: 13px;
      white-space: nowrap;
    }

    .toast[hidden] {
      display: none !important;
    }

    @media (min-width: 520px) {
      .stage {
        padding: 8px 0 16px;
      }

      .device {
        border-radius: 28px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">Browser preview of the miniprogram. The real project still opens in WeChat Developer Tools.</p>
    <div class="device home" id="device">
      <div class="nav" id="nav"></div>
      <div class="scroll" id="scroll"></div>
      <div class="dock" id="dock"></div>
      <div class="modal" id="modal" hidden>
        <div class="sheet">
          <p class="sheet-title">Give up this spot?</p>
          <p class="sheet-copy">The pass code on this phone will be deleted.</p>
          <div class="sheet-actions">
            <button type="button" class="ghost" data-action="keep">Keep</button>
            <button type="button" class="danger" data-action="drop">Drop</button>
          </div>
        </div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </div>
  </div>
  <script src="../utils/event.js"></script>
  <script src="../utils/form.js"></script>
  <script src="preview.js"></script>
</body>
</html>
