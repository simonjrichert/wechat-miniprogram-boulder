<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banana Bouldering — browser preview</title>
  <link rel="stylesheet" href="preview.css?v=13">
  <style>
    :root {
      --screen-w: min(390px, calc(100vw - 96px));
      --screen-h: min(844px, calc(100dvh - 148px));
      --rpx: calc(var(--screen-w) / 750);
    }

    body {
      margin: 0;
      background: #0c0b10;
      color: #f4f0ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 16px 12px 20px;
      background:
        radial-gradient(circle at 50% 0%, #2c2640 0%, transparent 42%),
        #0c0b10;
    }

    .note {
      margin: 0 0 14px;
      padding: 0 16px;
      color: #9a94ae;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .iphone {
      position: relative;
      box-sizing: border-box;
      width: calc(var(--screen-w) + 8px);
      height: calc(var(--screen-h) + 8px);
      flex: 0 0 auto;
      padding: 4px;
      border-radius: 42px;
      background: #2a2a2e;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.35),
        0 28px 70px rgba(0, 0, 0, 0.55);
    }

    .hw {
      position: absolute;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(#6a6a72, #1a1a1e);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .hw-silent {
      left: -3px;
      top: 15%;
      height: 4%;
    }

    .hw-vol {
      left: -3px;
      height: 8%;
    }

    .hw-vol-up {
      top: 22%;
    }

    .hw-vol-down {
      top: 32%;
    }

    .hw-power {
      right: -3px;
      top: 24%;
      height: 13%;
    }

    .device {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 38px;
      background: #07060b;
    }

    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 70;
      width: 122px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #000;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
      pointer-events: none;
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      bottom: 8px;
      z-index: 70;
      width: 132px;
      height: 5px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      pointer-events: none;
    }

    .device * {
      box-sizing: border-box;
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .scroll::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .device .nav,
    .device .dock {
      position: relative;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      flex-shrink: 0;
    }

    .device .nav {
      padding-top: 54px;
    }

    .device .bar {
      min-height: calc(88 * var(--rpx));
    }

    .nav-home {
      padding-top: 58px;
    }

    .device .date-badge {
      right: 0;
    }

    .device .dock {
      padding-bottom: 26px;
    }

    .nav-home .bar {
      min-height: 0;
    }

    .home .page {
      padding-bottom: calc(28 * var(--rpx));
    }

    .device button {
      font-family: inherit;
      cursor: pointer;
      border: 0;
      background: transparent;
    }

    .device input,
    .device select {
      font-family: inherit;
      font-size: max(16px, calc(30 * var(--rpx)));
    }

    .device input:focus,
    .device select:focus {
      outline: none;
      border-color: rgba(61, 255, 242, 0.85);
    }

    .device select.field {
      appearance: none;
    }

    .wave,
    .choice,
    .agree,
    .code-wrap,
    .row {
      cursor: pointer;
    }

    #dock[hidden] {
      display: none !important;
    }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: flex-end;
      padding: 16px;
      background: rgba(0, 0, 0, 0.55);
    }

    .modal[hidden] {
      display: none !important;
    }

    .sheet {
      width: 100%;
      padding: 22px 18px 16px;
      border-radius: 20px;
      background: #14121c;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .sheet-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .sheet-copy {
      margin: 8px 0 18px;
      color: #b7b1c9;
      font-size: 14px;
      line-height: 1.45;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
    }

    .sheet-actions button {
      flex: 1;
    }

    .device .danger {
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: #ff2bd6;
      color: #1a0612;
      font-size: 15px;
      font-weight: 700;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 50;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(20, 18, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f4f0ff;
      font-size: 13px;
      white-space: nowrap;
    }

    .toast[hidden] {
      display: none !important;
    }

    @media (max-width: 420px) {
      .hw {
        display: none;
      }

      .iphone {
        width: min(100vw - 12px, calc(var(--screen-w) + 8px));
        padding: 3px;
        border-radius: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="note">Browser preview of the miniprogram. The real project still opens in WeChat Developer Tools.</p>
    <div class="iphone">
      <span class="hw hw-silent"></span>
      <span class="hw hw-vol hw-vol-up"></span>
      <span class="hw hw-vol hw-vol-down"></span>
      <span class="hw hw-power"></span>
      <div class="device home" id="device">
        <div class="island"></div>
        <div class="home-indicator"></div>
        <div class="nav" id="nav"></div>
        <div class="scroll" id="scroll"></div>
        <div class="dock" id="dock"></div>
        <div class="modal" id="modal" hidden>
          <div class="sheet">
            <p class="sheet-title">Give up this spot?</p>
            <p class="sheet-copy">The pass code on this phone will be deleted.</p>
            <div class="sheet-actions">
              <button type="button" class="ghost" data-action="keep">Keep</button>
              <button type="button" class="danger" data-action="drop">Drop</button>
            </div>
          </div>
        </div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
  </div>
  <script src="../utils/event.js?v=6"></script>
  <script src="../utils/form.js"></script>
  <script src="preview.js?v=8"></script>
</body>
</html>
